---

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 0
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  # VM_HOST Pool:
  VM_START_NUM: "001"
  VM_END_NUM: "016"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

stages:
  - pre-test
  - test

.do_build:
  # https://stackoverflow.com/questions/62689235/gitlab-ci-how-to-ignore-directory-using-rules-syntax
  rules:
    - changes:
        - .ci/
        - packaging/
        - go/
        - rpmbuild/
      when: never
    - when: on_success
  tags: [k8s, linux, x86_64]
  # tags: [k8s, mtr-rdma, x86_64]

build-job:
  extends: .do_build
  stage: pre-test
  image: "$FEDORA_IMAGE"
  variables:
    XLIO_SHA: 3.51.1
  script:
    - .ci/install_xlio.sh $XLIO_SHA
    - ./configure --with-rdma=mlx5_dv --target-arch=haswell --with-crypto --with-vfio-user --with-xlio=/tmp/libxlio/install --enable-debug --enable-werror
    - make -j4
    - find test -type f -perm 0755 |egrep -v '\.sh|\.py|\.pl|\/match' |tar cf .test.tar -T /dev/stdin
  artifacts:
    expire_in: 3 day
    paths:
      - ./build
      - ./dpdk/build/
      - .test.tar
      - ./mk/config.mk
      - ./mk/cc.mk
      - ./include/spdk/config.h
      - ./include/spdk/version.h
      - ./python

build-verbs-debug:
  extends: .do_build
  stage: pre-test
  image: "$FEDORA_IMAGE"
  variables:
    XLIO_SHA: 3.51.1
  script:
    - cd $CI_PROJECT_DIR
    - .ci/install_xlio.sh $XLIO_SHA
    - ./configure --with-rdma --target-arch=haswell --with-crypto --with-vfio-user --with-xlio=/tmp/libxlio/install --with-shared --enable-debug --enable-werror
    - make -j4

unittest-mlx5_dv-debug:
  extends: .do_build
  stage: pre-test
  image: "$FEDORA_IMAGE"
  variables:
    XLIO_SHA: 3.51.1
  script:
    - cd $CI_PROJECT_DIR
    - .ci/install_xlio.sh $XLIO_SHA
    - ./configure --with-rdma=mlx5_dv --target-arch=haswell --with-crypto --with-vfio-user --with-xlio=/tmp/libxlio/install --with-shared --enable-debug --enable-werror
    - make -j4
    - ./test/unit/unittest.sh

unittest-mlx5_dv-release:
  extends: .do_build
  stage: pre-test
  image: "$FEDORA_IMAGE"
  variables:
    XLIO_SHA: 3.51.1
  script:
    - cd $CI_PROJECT_DIR
    - .ci/install_xlio.sh $XLIO_SHA
    - ./configure --with-rdma=mlx5_dv --target-arch=haswell --with-crypto --with-vfio-user --with-xlio=/tmp/libxlio/install --with-shared --enable-werror
    - make -j4
    - ./test/unit/unittest.sh

.test-job-vm-template:
  stage: test
  tags: [vm, linux, x86_64, f39]
  needs:
    - job: build-job
  rules:
    - changes:
        - .ci/
        - packaging/
        - go/
        - rpmbuild/
      when: never
    - when: on_success
  hooks:
    pre_get_sources_script:
    - sudo rm -rf python/spdk/rpc/__pycache__

.test-job-k8s-template:
  extends: .test-job-vm-template
  tags: [k8s, mtr-rdma, x86_64]
  image: "$FEDORA_IMAGE"
  hooks:
    pre_get_sources_script: []
  variables:
    GIT_FETCH_EXTRA_FLAGS: "--tags"

test-nvmf-k8s-job:
  extends: .test-job-k8s-template
  script:
    - grep -i huge /proc/meminfo
    - mount
    - tar xf .test.tar
    # Set RPC_PIPE_TIMEOUT to 60 seconds to avoid timeout errors in K8S tests
    - export RPC_PIPE_TIMEOUT=60
    # Run NVMf/RDMA tests in the container
    - sudo -E NET_TYPE=phy ./test/nvmf/host/bdevperf.sh --transport=rdma
    - sudo -E NET_TYPE=phy ./test/nvmf/host/discovery.sh --transport=rdma
    - sudo -E NET_TYPE=phy ./test/nvmf/host/identify.sh --transport=rdma
    # multipath.sh doesn't work in K8s container
    # - sudo -E NET_TYPE=phy ./test/nvmf/host/multipath.sh --transport=rdma

autotest-vm_host-matrix:
  tags: [vm_host, x86_64]
  stage: test
  parallel:
    matrix:
      - TEST_TYPE: [nvme, accel, fsdev]
  before_script:
    - .ci/prepare_vm.sh
  script:
    - ./autorun.sh .ci/autotest-${TEST_TYPE}.conf
  after_script:
    - tar czf $CI_PROJECT_DIR/${TEST_TYPE}_artifacts.tar -C $CI_PROJECT_DIR/.. output
  artifacts:
    name: ${TEST_TYPE}_artifacts
    paths:
      - $CI_PROJECT_DIR/${TEST_TYPE}_artifacts.tar
    expire_in: 3 days
    when: always

test-crypto-k8s-job:
  extends: .test-job-k8s-template
  tags: [crypto, k8s, x86_64, oci-sriov]
  script:
    - export CI_DUT_RDMA=$(rdma link |grep "$CI_DUT_IFACE" |sed -e 's/^link //; s#/.*##')
    - grep -i huge /proc/meminfo
    - tar xf .test.tar
    - sudo ./test/accel/mlx5/accel_mlx5_crypto_key_upper_lba.sh --allowed-devs=${CI_DUT_RDMA}
    - sudo ./test/accel/mlx5/accel_mlx5_crypto.sh --allowed-devs=${CI_DUT_RDMA}
    - sudo ./test/accel/mlx5/accel_mlx5_crypto.sh --allowed-devs=${CI_DUT_RDMA} --transport=rdma

coverity-job:
  extends: .do_build
  stage: pre-test
  image: "$COV_IMAGE"
  script:
    - apt-get -q update
    - ./scripts/pkgdep.sh
    - ./configure --with-rdma=mlx5_dv --disable-unit-tests
    - cov-build --dir cov_build make -j 4
    - cov-analyze --jobs auto --security --concurrency --dir cov_build
    - cov-format-errors --dir cov_build --html-output cov_build/html
    - nr=$(cov-format-errors --dir cov_build |& awk '/Processing [0-9]+ errors?/ { print $2 }')
    - exit $nr
  variables:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/cov/bin
    CC: gcc-9
  allow_failure: true
  artifacts:
    name: coverity
    paths:
      - cov_build/html/
    expire_in: 1 week
    when: always

code-style-job:
  extends: .do_build
  stage: pre-test
  image: "$COV_IMAGE"
  script:
    - apt-get -q update
    - ./scripts/pkgdep.sh --developer-tools
    - ./scripts/check_format.sh

check-so-deps-job:
  extends: .test-job-k8s-template
  tags: [k8s, linux, x86_64]
  script:
    - tar xf .test.tar
    - ./scripts/pkgdep.sh --developer-tools
    - ./configure --with-rdma=mlx5_dv --enable-debug --enable-werror --with-shared
    - make -j4
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/Mellanox/spdk_team/spdk-abi.git test/make/abi
    - sudo ./test/make/check_so_deps.sh

